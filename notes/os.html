<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作業系統 OS | CS Notes Hub</title><link rel="stylesheet" href="../style.css"><style>.viewer-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}.slide-menu{display:flex;flex-direction:column;gap:8px}.slide-choice{border:1px solid #31465e;border-radius:10px;background:#142237;color:#e9f1ff;text-align:left;padding:13px;cursor:pointer;font:inherit}.slide-choice:hover,.slide-choice.active{border-color:#4bd4db;background:#1c3549}.viewer{width:100%;height:min(75vh,820px);border:1px solid #31465e;border-radius:12px;background:#101b2c}.notice{color:#a7b7ca;font-size:.9rem}@media(max-width:760px){.viewer-layout{grid-template-columns:1fr}.viewer{height:68vh}.slide-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header class="site-header"><nav class="container nav"><a class="logo" href="../index.html">CS <span>Notes</span> Hub</a><a href="../index.html">← 返回首頁</a></nav></header><main class="container" style="padding:40px 0"><h1>作業系統 OS｜教材閱讀</h1><p class="lead">選擇左側教材，即可直接在網站中閱讀 PDF 投影片。</p><div class="viewer-layout"><aside class="slide-menu" aria-label="教材選單"><button class="slide-choice" type="button" data-file="../slides/Ch01_Introduction_0911.pdf">Ch01 Introduction</button><button class="slide-choice" type="button" data-file="../slides/Ch02_Operating-System%20Structures.pdf">Ch02 Operating-System Structures</button><button class="slide-choice" type="button" data-file="../slides/Ch03_Process%20Management.pdf">Ch03 Process Management</button><button class="slide-choice" type="button" data-file="../slides/Ch04_Threads%20%26%20Concurrency.pdf">Ch04 Threads & Concurrency</button><button class="slide-choice" type="button" data-file="../slides/Ch05_CPU%20Scheduling.pdf">Ch05 CPU Scheduling</button></aside><section><h2 id="viewer-title" style="margin-top:0">選擇教材</h2><iframe id="slide-viewer" class="viewer" title="課程 PDF 閱讀器"></iframe><p id="status" class="notice">如果顯示找不到檔案，代表原始教材尚未上傳至 GitHub。</p><a id="open-file" class="back" target="_blank" rel="noopener" href="#">在新分頁開啟原始教材 ↗</a></section></div></main><footer><div class="container">© 2026 CS Notes Hub</div></footer><script>const buttons=[...document.querySelectorAll('.slide-choice')];const viewer=document.querySelector('#slide-viewer');const heading=document.querySelector('#viewer-title');const openFile=document.querySelector('#open-file');function select(b){buttons.forEach(x=>x.classList.toggle('active',x===b));heading.textContent=b.textContent;viewer.src=b.dataset.file;openFile.href=b.dataset.file;}buttons.forEach(b=>b.addEventListener('click',()=>select(b)));if(buttons.length)select(buttons[0]);</script></body></html>
